<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audio engine test</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07060b; color: #ddd; font: 14px system-ui, sans-serif; }
    #bar { display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: #121019; flex-wrap: wrap; }
    #bar select, #bar button, #bar label { background: #1d1a28; color: #ddd; border: 1px solid #333; padding: 6px 10px;
      border-radius: 6px; font: inherit; cursor: pointer; }
    #bar input[type=file] { display: none; }
    #src { color: #8a84a3; }
    canvas { display: block; width: 100%; height: calc(100% - 52px); }
  </style>
</head>
<body>
  <div id="bar">
    <select id="device"><option value="">default input</option></select>
    <button id="start">Start input</button>
    <label>Test with an audio file<input id="file" type="file" accept="audio/*"></label>
    <audio id="player" controls loop style="height: 32px; flex: 1; min-width: 300px; display: none"></audio>
    <span id="src">not running</span>
  </div>
  <canvas id="c"></canvas>
  <script type="module" src="js/audio-test.js"></script>
</body>
</html>
